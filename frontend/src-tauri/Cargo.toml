[package]
name = "multi-ai-group"
version = "0.1.0"
description = "多 AI 群组对局桌面应用"
authors = ["MultiAIGroup"]
edition = "2021"

[lib]
name = "multi_ai_group_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
